plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Security patch releases newer than the ones Spring Boot 3.5.16 manages. Same minor lines (Tomcat 10.1.x,
// Jackson 2.21.x), so API-compatible; remove each line once a Spring Boot release catches up to it.
// Tomcat 10.1.58 was never published to Maven Central (10.1.57 jumps to 10.1.59); 10.1.61 is the latest 10.1.x.
ext['tomcat.version'] = '10.1.61'
ext['jackson-bom.version'] = '2.21.7'

group = 'com.kashmirmenu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Observability
    // Renders Micrometer's metrics in Prometheus' text format at /actuator/prometheus.
    // runtimeOnly: nothing on the compile classpath needs it, and the version comes from the
    // Spring Boot BOM so it cannot drift out of step with Boot 3.5.4.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // JSON log output on the prod profile, so lines are queryable and keep the requestId MDC
    // field as a first-class property rather than buried in a message string.
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'


    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    // QR Code
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    //websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // Gradle's default prints only "AssertionError at Foo.java:64" and hides the message, so a
    // failure whose cause is in the message - an HTTP status and response body, say - is
    // undiagnosable from the console. Show the exception, its message and a trimmed trace.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showExceptions true
        showStackTraces false
    }
}


// The integration tests again, against a real MySQL instead of H2.
//
// H2 is quick but is not MySQL: it cannot show a migration that fails, an entity that disagrees with the
// migrated schema, or the locking and isolation behaviour the ordering and payment code relies on. This
// runs the same *IT classes (plus MysqlConcurrencyIT, which only runs here) against the throwaway
// database in docker-compose.test.yml:
//
//     docker compose -f docker-compose.test.yml up -d --wait
//     ./gradlew mysqlTest
//     docker compose -f docker-compose.test.yml down -v
tasks.register('mysqlTest', Test) {
    group = 'verification'
    description = 'Runs the integration tests against a real MySQL (start docker-compose.test.yml first).'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class'

    systemProperty 'km.test.profile', 'mysql-test'
    // One zone for the JVM and the database container (which is UTC), so stored times round-trip exactly.
    jvmArgs '-Duser.timezone=UTC'

    // The database is outside Gradle's view, so a run is never "up to date".
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showExceptions true
        showStackTraces false
    }
}
