spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kashmir_menu}
    username: ${DB_USERNAME:kashmirmenu}
    password: ${DB_PASSWORD:change-me-locally}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.kashmirmenu: DEBUG

jwt:
  # No default, even in dev: a committed secret is a real secret the moment a dev profile
  # reaches a shared environment. Generate one locally with:
  #   export JWT_SECRET=$(openssl rand -base64 48)
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}