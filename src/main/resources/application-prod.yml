spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: false

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.kashmirmenu: INFO

jwt:
  # No default — startup fails fast if JWT_SECRET isn't provided.
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}

app:
  # No default — encoded into table QR codes; must be the public frontend origin.
  public-base-url: ${PUBLIC_BASE_URL}
  cors:
    # No default — must be set explicitly for prod (comma-separated origins).
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Swagger/OpenAPI is a pre-auth-exposed surface; keep it off in prod.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false