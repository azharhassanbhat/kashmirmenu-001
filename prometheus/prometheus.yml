# Prometheus for KashmirMenu.
#
# Reaches the application on its management port over the kashmirmenu-observability network. That
# port is never published to the host and nginx never proxies it, so this file is the only route to
# the metrics. Prometheus itself publishes no host port either (see docker-compose.observability.yml):
# reach its UI through an SSH tunnel or `docker compose exec`, and use Grafana for day-to-day viewing.

global:
  scrape_interval: 15s
  # Comfortably under the interval. A timeout at or above it causes scrapes to overlap, which shows
  # up as gaps rather than as the slow target it really is.
  scrape_timeout: 10s
  evaluation_interval: 30s

  external_labels:
    environment: ${ENVIRONMENT:-local}
    cluster: kashmirmenu

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kashmirmenu
    metrics_path: /actuator/prometheus
    # Service name and management port from the application compose file.
    static_configs:
      - targets: ['app:9091']
        labels:
          service: backend
          component: api

  # Prometheus watching itself: without this a scrape failure elsewhere has nothing to be compared
  # against, and the ScrapeFailing alert cannot distinguish "target down" from "Prometheus down".
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
