# Included in the server block AND in every location that sets its own add_header.
# nginx only inherits add_header from the enclosing level when a block defines none,
# so a location with Cache-Control would otherwise silently drop these.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Features this app never uses are switched off, so injected or third-party content cannot ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# A page of ours cannot be given a handle to a window opened by another origin (and vice versa).
add_header Cross-Origin-Opener-Policy same-origin always;
# HSTS is deliberately not here: it must only ever be sent over HTTPS. Add it where TLS is terminated:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options SAMEORIGIN always;

# Content-Security-Policy. The app ships no inline scripts, so script-src is 'self' only.
#  - img-src allows https: because restaurants enter their own logo / dish image URLs,
#    data: for the icons inlined in the stylesheet, and blob: for the generated QR image.
#  - connect-src 'self' covers /api and the same-origin /ws websocket (nginx proxies both).
#  - frame-ancestors supersedes X-Frame-Options in current browsers (both are kept).
# If you serve images from a known CDN, replace https: with that origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
