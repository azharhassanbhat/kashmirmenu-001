# Reused connections to the backend. Without keepalive nginx opened (and closed) a new connection for every
# API request; each closed one lingers in TIME_WAIT holding a local port, and at roughly 450 requests a second
# the container ran out of ports ("connect() failed (99: Address not available)"), which showed as 502 errors
# while the application itself was nearly idle.
upstream km_app {
  server app:8080;
  keepalive 64;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    # nginx refuses request bodies over 1 MB by default, which would reject nearly every phone photo
    # before it reaches the app. The app enforces its own 10 MB limit and re-encodes what it accepts.
    client_max_body_size 12m;
    proxy_pass http://km_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (not append) so a client cannot spoof the address the backend rate-limits on.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
