name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  # The same integration tests against a real MySQL, with every migration applied and Hibernate
  # validating the entities against the migrated schema. The H2 job above is fast but is not MySQL: it
  # cannot show a migration that fails, a mapping that disagrees with the schema, or the locking and
  # isolation behaviour the ordering and payment code depends on. See docs/QR_ORDERING_OPERATIONS.md.
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kashmir_menu_test
          MYSQL_USER: kashmirmenu_test
          MYSQL_PASSWORD: kashmirmenu_test_pw
          MYSQL_ROOT_PASSWORD: root_test_pw
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integration tests against MySQL
        run: ./gradlew mysqlTest --console=plain
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/kashmir_menu_test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-reports
          path: build/reports/tests/mysqlTest
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-build:
    needs: [build-and-test, mysql-integration, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t kashmirmenu:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t kashmirmenu-frontend:${{ github.sha }} frontend